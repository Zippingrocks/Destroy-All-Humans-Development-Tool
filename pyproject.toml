[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dah-development-tool"
version = "0.1.0"
description = "Read-only inspection and translation tools for Destroy All Humans! maps"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dahdev = "dahdev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dahdev = ["data/*.json"]

